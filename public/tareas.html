<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Tareas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #fafafa;
        }
        h1 { color: #333; text-align: center; }
        form {
            margin-bottom: 20px;
            text-align: center;
        }
        input, select {
            margin: 5px;
            padding: 8px;
        }
        button {
            padding: 8px 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #1976D2; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .acciones button {
            margin: 0 5px;
            background-color: #4CAF50;
        }
        .acciones button.eliminar {
            background-color: #f44336;
        }
        .acciones button:hover {
            opacity: 0.8;
        }
        .volver {
            display: inline-block;
            margin-bottom: 20px;
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>Gestión de Tareas</h1>

    <div style="text-align: center;">
        <a href="index.html">
            <button class="volver">⬅️ Volver al Menú Principal</button>
        </a>
    </div>

    <form id="formTarea">
        <input type="hidden" id="tareaId">
        <input type="number" id="cliente_id" placeholder="ID del Cliente" required>
        <input type="text" id="descripcion" placeholder="Descripción de la tarea" required>
        <select id="estado">
            <option value="pendiente">Pendiente</option>
            <option value="en progreso">En Progreso</option>
            <option value="completada">Completada</option>
        </select>
        <button type="submit">Agregar Tarea</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>ID Cliente</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaTareas"></tbody>
    </table>

    <script>
        const form = document.getElementById("formTarea");
        const tabla = document.getElementById("tablaTareas");
        const tareaId = document.getElementById("tareaId");
        const btnSubmit = form.querySelector("button");

    // Cargar tareas al iniciar
    async function cargarTareas() {
        const res = await fetch("/tareas");
        const tareas = await res.json();
        tabla.innerHTML = tareas.map(t => `
            <tr>
                <td>${t.id}</td>
                <td>${t.cliente_id}</td>
                <td>${t.descripcion}</td>
                <td>${t.estado}</td>
                <td class="acciones">
                    <button onclick="editarTarea(${t.id}, ${t.cliente_id}, '${t.descripcion}', '${t.estado}')">✏️ Editar</button>
                    <button class="eliminar" onclick="eliminarTarea(${t.id})">🗑️ Eliminar</button>
                </td>
            </tr>
        `).join("");
    }

    // Agregar o editar tarea
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const tarea = {
            cliente_id: cliente_id.value,
            descripcion: descripcion.value,
            estado: estado.value
        };

        if (tareaId.value) {
        // Editar tarea
            await fetch(`/tareas/${tareaId.value}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(tarea)
            });
            btnSubmit.textContent = "Agregar Tarea";
        } else {
            // Agregar nueva tarea
            await fetch("/tareas", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(tarea)
            });
        }

        form.reset();
        tareaId.value = "";
        cargarTareas();
    });

    // Rellenar formulario para editar
    function editarTarea(id, cliente, descripcionT, estadoT) {
        tareaId.value = id;
        cliente_id.value = cliente;
        descripcion.value = descripcionT;
        estado.value = estadoT;
        btnSubmit.textContent = "Guardar Cambios";
    }

    // Eliminar tarea
    async function eliminarTarea(id) {
        if (confirm("¿Seguro que deseas eliminar esta tarea?")) {
            await fetch(`/tareas/${id}`, { method: "DELETE" });
            cargarTareas();
        }
    }

    // Inicial
    cargarTareas();
    </script>
</body>
</html>
