<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #fafafa;
        }
        h1 { color: #333; text-align: center; }
        form {
            margin-bottom: 20px;
            text-align: center;
        }
        input {
            margin: 5px;
            padding: 8px;
        }
        button {
            padding: 8px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .acciones button {
            margin: 0 5px;
            background-color: #2196F3;
        }
        .acciones button.eliminar {
            background-color: #f44336;
        }
        .acciones button:hover {
            opacity: 0.8;
        }
        .volver {
            display: inline-block;
            margin-bottom: 20px;
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>Gestión de Clientes</h1>

    <div style="text-align: center;">
        <a href="index.html">
        <button class="volver">⬅️ Volver al Menú Principal</button>
        </a>
    </div>

    <form id="formCliente">
        <input type="hidden" id="clienteId">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="text" id="documento" placeholder="Documento" required>
        <input type="text" id="telefono" placeholder="Teléfono">
        <button type="submit">Agregar Cliente</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Documento</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaClientes"></tbody>
    </table>

    <script>
        const form = document.getElementById("formCliente");
        const tabla = document.getElementById("tablaClientes");
        const clienteId = document.getElementById("clienteId");
        const btnSubmit = form.querySelector("button");

    // Cargar clientes al iniciar
        async function cargarClientes() {
            const res = await fetch("/clientes");
            const clientes = await res.json();
            tabla.innerHTML = clientes.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.nombre}</td>
                    <td>${c.documento}</td>
                    <td>${c.telefono || ""}</td>
                    <td class="acciones">
                        <button onclick="editarCliente(${c.id}, '${c.nombre}', '${c.documento}', '${c.telefono || ""}')">✏️ Editar</button>
                        <button class="eliminar" onclick="eliminarCliente(${c.id})">🗑️ Eliminar</button>
                    </td>
                </tr>
            `).join("");
        }

    // Agregar o editar cliente
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const cliente = {
                nombre: nombre.value,
                documento: documento.value,
                telefono: telefono.value
            };

            if (clienteId.value) {
        // Editar
                await fetch(`/clientes/${clienteId.value}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(cliente)
                });
                btnSubmit.textContent = "Agregar Cliente";
            } else {
        // Agregar
                await fetch("/clientes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(cliente)
                });
            }

            form.reset();
            clienteId.value = "";
            cargarClientes();
        });

    // Rellenar formulario para editar
        function editarCliente(id, nombreC, documentoC, telefonoC) {
            clienteId.value = id;
            nombre.value = nombreC;
            documento.value = documentoC;
            telefono.value = telefonoC;
            btnSubmit.textContent = "Guardar Cambios";
        }

    // Eliminar cliente
        async function eliminarCliente(id) {
            if (confirm("¿Seguro que deseas eliminar este cliente?")) {
                await fetch(`/clientes/${id}`, { method: "DELETE" });
                cargarClientes();
            }
        }

    // Inicial
        cargarClientes();
    </script>
</body>
</html>
